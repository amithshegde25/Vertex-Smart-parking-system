{% extends "base.html" %}

{% block title %}Login - Smart Parking System{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-header">
    <h2>User Login</h2>
    <p>Sign in to access your parking dashboard</p>
  </div>

  <form action="{{ url_for('login') }}" method="POST">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="Enter registered email" required autofocus>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Login</button>
  </form>

  <div class="form-footer">
    Don't have an account yet? <a href="{{ url_for('register') }}">Register here</a>
  </div>
</div>
{% endblock %}
